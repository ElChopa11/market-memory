[project]
name = "mm-lab-cli"
version = "0.1.0"
description = "Coordinator surface (`lab` CLI)."
requires-python = ">=3.12"
dependencies = [
  "mm-common",
  "mm-memory",
  "mm-ingest",
  "mm-provenance",
  "mm-research-kit",
]

[project.scripts]
lab = "mm_lab_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
