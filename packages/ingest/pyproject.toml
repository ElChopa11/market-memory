[project]
name = "mm-ingest"
version = "0.1.0"
description = "Read-only Hyperliquid public info ingest."
requires-python = ">=3.12"
dependencies = [
  "mm-common",
  "mm-memory",
  "mm-provenance",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
