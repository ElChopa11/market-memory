[project]
name = "mm-desks"
version = "0.1.0"
description = "Phase 5d desk runners (Crypto 3a / Equities 3b + Intel/Quant/Skeptic/Risk/Coord). Telegram send is mm_delivery."
requires-python = ">=3.12"
dependencies = [
  "mm-common",
  "mm-quant",
  "mm-research-kit",
  "mm-risk",
  "mm-delivery",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
