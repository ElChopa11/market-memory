[project]
name = "mm-risk"
version = "0.1.0"
description = "Deterministic allow/block from versioned risk config. No LLM. No orders. Not the risk service."
requires-python = ">=3.12"
dependencies = [
  "mm-common",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
