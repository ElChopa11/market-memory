# One-off history backfill for a fresh Neon database.
#
# DO NOT RUN until the Principal says so after the Thursday unattended fire.
# Sequence: lab migrate has already been applied, and this job runs before
# recurring ingest-persist. This workflow does not call lab migrate, does not
# start ingest-persist, and does not brief or deliver.
#
# Trigger: workflow_dispatch only. No timer. hybrid-sydney-morning is a
# different file and is not modified here. That file cannot start this one.
# There is no repository_dispatch trigger.
#
# Two jobs:
# - skip: i_mean_it_backfill is not true. Prints SKIP, exits 0. No secrets,
#   no checkout, no Environment, so it does not wait for a reviewer.
# - history-backfill: input is true. Names Environment neon-write. That is
#   the hard gate in front of secrets and the database. Required reviewers
#   must approve before the job starts. i_mean_it_backfill stays; approval
#   does not replace it.
#
# A true dispatch before Environment neon-write exists can create that
# Environment with no protection rules. See docs/runbooks/ingest.md.
#
# Secret names only, on the history-backfill job: POSTGRES_DSN,
# POLYGON_API_KEY, FRED_API_KEY, MINIO_ENDPOINT, MINIO_ACCESS_KEY,
# MINIO_SECRET_KEY. MINIO_BUCKET stays unset (code default bucket
# market-memory). S3_REGION=auto is job env, not a secret. Never TELEGRAM_*.
# Paper only. Do not auto-merge.

name: history-backfill

on:
  workflow_dispatch:
    inputs:
      i_mean_it_backfill:
        description: >-
          Principal prove: one-off history backfill into Postgres (Polygon daily,
          full FRED DGS10/DGS2, HL 1d candles). Default false prints SKIP and
          does not touch the database, any API, or Environment neon-write.
          Do not run until after migrate, after the Thursday unattended fire,
          and until neon-write has Required reviewers set to the Principal.
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: history-backfill
  cancel-in-progress: false

jobs:
  skip:
    # Ungated. A false dispatch prints SKIP and exits 0 without requesting
    # Environment neon-write. No secrets. No checkout.
    if: inputs.i_mean_it_backfill != true && github.event.inputs.i_mean_it_backfill != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Gate — SKIP unless i_mean_it_backfill
        run: |
          set -euo pipefail
          echo "SKIP"
          echo "history-backfill: i_mean_it_backfill is not true. No database write. No API calls."
          exit 0

  history-backfill:
    # Hard gate. Evaluated only when i_mean_it_backfill is true. A false
    # dispatch skips this job; a skipped job does not wait for reviewers
    # and does not materialise secrets. Do not chain skip in front of
    # this job. The jobs are mutually exclusive; a dependency would skip
    # the apply on the true path, because skip is skipped then.
    if: github.event_name == 'workflow_dispatch' && (inputs.i_mean_it_backfill == true || github.event.inputs.i_mean_it_backfill == 'true')
    environment: neon-write
    runs-on: ubuntu-latest
    env:
      POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      # MINIO_BUCKET is intentionally not mapped.
      S3_REGION: auto
      I_MEAN_IT_BACKFILL: ${{ inputs.i_mean_it_backfill }}
    steps:
      - name: Gate — refuse unless i_mean_it_backfill and secrets are present
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            echo "::error::history backfill is workflow_dispatch only. Refusing."
            exit 1
          fi
          if [ "${I_MEAN_IT_BACKFILL}" != "true" ]; then
            echo "::error::REFUSE: i_mean_it_backfill is not true. Environment approval does not replace the input gate. Not connecting."
            exit 1
          fi
          if [ -z "${POSTGRES_DSN:-}" ]; then
            echo "::error::POSTGRES_DSN is empty. Refusing before any database write."
            exit 1
          fi
          if [ -z "${POLYGON_API_KEY:-}" ]; then
            echo "::error::POLYGON_API_KEY is empty. Refusing before any Polygon call."
            exit 1
          fi
          if [ -z "${FRED_API_KEY:-}" ]; then
            echo "::error::FRED_API_KEY is empty. Refusing before any FRED call."
            exit 1
          fi
          if [ -z "${MINIO_ENDPOINT:-}" ] || [ -z "${MINIO_ACCESS_KEY:-}" ] || [ -z "${MINIO_SECRET_KEY:-}" ]; then
            echo "::error::MINIO_ENDPOINT, MINIO_ACCESS_KEY, and MINIO_SECRET_KEY must all be set. Refusing before any raw_object pointer."
            exit 1
          fi
          if [ -n "${MINIO_BUCKET:-}" ]; then
            echo "::error::MINIO_BUCKET must stay unset (code default bucket is market-memory)."
            exit 1
          fi
          if [ "${S3_REGION:-}" != "auto" ]; then
            echo "::error::S3_REGION must be auto (job env, not a secret)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "backfill gate ok (values not printed). S3_REGION=auto. i_mean_it_backfill=true."

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Sync workspace
        if: steps.gate.outputs.ready == 'true'
        run: uv sync --all-packages

      - name: History backfill (Polygon daily, FRED full series, HL 1d)
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # No --no-db. No --fixture. No brief. No deliver. No migrate.
          echo "lab history-backfill (persist)"
          uv run lab history-backfill
