# Test (Phase 4)

name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest-and-lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: market_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d market_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DSN: postgresql://lab:lab@localhost:5432/market_memory
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Migrate Market Memory schema
        run: uv run lab migrate
      - name: Tests
        run: uv run pytest
      - name: Lifecycle DoD gates
        run: bash scripts/check-lifecycle.sh
      - name: Import boundaries (research/desks/quant/delivery/flow/macro/listings vs execution; Intel vs opine; no Redis)
        run: uv run python scripts/check_import_boundaries.py
      - name: Improvement-queue hygiene (single IN_PROGRESS; no auto-merge)
        run: uv run python scripts/check_queue.py
      - name: No Redis bus
        run: |
          ! git grep -n -E '^[ \t]*(import redis|from redis|import aioredis|from aioredis)\b' -- packages apps
      - name: Opine packages cannot import mm_execution
        run: |
          ! git grep -n -E '^[ \t]*(import mm_execution|from mm_execution)\b' -- packages/research_kit packages/desks packages/quant packages/delivery packages/flow packages/macro packages/listings
      - name: Intel cannot import opine packages
        run: |
          ! git grep -n -E '^[ \t]*(import mm_research_kit|from mm_research_kit|import mm_desks|from mm_desks|import mm_quant|from mm_quant|import mm_delivery|from mm_delivery|import mm_flow|from mm_flow|import mm_macro|from mm_macro|import mm_listings|from mm_listings)\b' -- packages/ingest
      - name: Live remains hard-gated
        run: uv run python -c "import yaml, pathlib; p=pathlib.Path('config/risk/environments/live.yaml'); d=yaml.safe_load(p.read_text()); assert d.get('live_trading_enabled') is False, 'live trading must stay hard-gated'"
      - name: Telegram secrets not committed
        run: |
          ! git grep -nE 'TELEGRAM_BOT_TOKEN=[A-Za-z0-9:_-]{8,}' -- ':!.env.example'
          ! git grep -nE '^[ ]*TELEGRAM_BOT_TOKEN:' -- config
      - name: No signing surface in ingest
        run: |
          ! git grep -n -E 'sign_l1_action|hl_trade|private_key|submit_order' -- packages/ingest packages/memory packages/provenance packages/common packages/research_kit packages/briefing packages/backtest packages/paper packages/source_health packages/desks packages/quant packages/delivery packages/flow packages/macro packages/listings apps/ingest-worker apps/lab-cli apps/briefing-worker
