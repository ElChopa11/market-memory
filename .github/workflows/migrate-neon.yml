# Dispatch-gated Alembic apply against Neon.
#
# workflow_dispatch ONLY. There is no cron and no push or pull_request
# trigger. A plain Run workflow leaves i_mean_it_migrate false, prints a
# skip line, exits 0, and does not connect.
#
# DO NOT RUN until the Principal says so after the Thursday unattended fire.
#
# Secret: repository secret POSTGRES_DSN only. Direct Neon host (no -pooler).
# No DATABASE_URL alias. No NEON_API_KEY. No object-store secrets.
# Command: uv run lab migrate (Alembic head). This file refuses unless the
# script head is 0012_heartbeat_if_not_exists, the revision verified in-repo.

name: migrate-neon

on:
  workflow_dispatch:
    inputs:
      i_mean_it_migrate:
        description: >-
          Apply Alembic head to repository secret POSTGRES_DSN (Neon direct
          host). Default false — Run workflow does not connect. There is no
          cron. DO NOT RUN until the Principal says so after the Thursday
          unattended fire.
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: migrate-neon
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless i_mean_it_migrate is true
        if: inputs.i_mean_it_migrate != true && github.event.inputs.i_mean_it_migrate != 'true'
        run: |
          echo "SKIP: i_mean_it_migrate is not true. Not connecting to Postgres. POSTGRES_DSN is not read."
          exit 0

      - uses: actions/checkout@v4
        if: inputs.i_mean_it_migrate == true || github.event.inputs.i_mean_it_migrate == 'true'

      - uses: astral-sh/setup-uv@v6
        if: inputs.i_mean_it_migrate == true || github.event.inputs.i_mean_it_migrate == 'true'
        with:
          python-version: "3.12"

      - name: Sync workspace
        if: inputs.i_mean_it_migrate == true || github.event.inputs.i_mean_it_migrate == 'true'
        run: uv sync --all-packages

      - name: Apply Alembic head to Neon
        if: inputs.i_mean_it_migrate == true || github.event.inputs.i_mean_it_migrate == 'true'
        env:
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
        run: |
          set -euo pipefail
          HEAD_ID="$(uv run python -c 'from mm_memory.migrate import alembic_head; print(alembic_head())')"
          echo "alembic_head=${HEAD_ID}"
          if [ "${HEAD_ID}" != "0012_heartbeat_if_not_exists" ]; then
            echo "REFUSE: script head is not 0012_heartbeat_if_not_exists. Not connecting."
            exit 1
          fi
          uv run python - <<'PY'
          import os
          import sys
          from urllib.parse import parse_qs, urlparse

          dsn = os.environ.get("POSTGRES_DSN") or ""
          if not dsn.strip():
              print("REFUSE: repository secret POSTGRES_DSN is empty. Not connecting.")
              sys.exit(1)
          for banned in ("DATABASE_URL", "NEON_API_KEY"):
              if (os.environ.get(banned) or "").strip():
                  print(f"REFUSE: {banned} is set. This job reads POSTGRES_DSN only. Not connecting.")
                  sys.exit(1)
          try:
              parsed = urlparse(dsn)
              host = (parsed.hostname or "").lower()
              modes = [item.lower() for item in parse_qs(parsed.query).get("sslmode", [])]
          except Exception:
              print("REFUSE: POSTGRES_DSN could not be parsed. Not connecting. DSN not printed.")
              sys.exit(1)
          if (not host.endswith(".neon.tech")) or ("-pooler" in host):
              print("REFUSE: POSTGRES_DSN must be a direct Neon host (suffix .neon.tech, no -pooler). Host not printed.")
              sys.exit(1)
          if modes not in (["require"], ["verify-full"], ["verify-ca"]):
              print("REFUSE: POSTGRES_DSN must set sslmode=require (or verify-full or verify-ca). Query not printed.")
              sys.exit(1)
          print("POSTGRES_DSN is set. Direct Neon host check passed. DSN not printed.")
          PY
          uv run lab migrate
