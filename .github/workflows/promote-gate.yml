# Promote-gate skeleton (Phase 6 later).
# Phase 0: always reports that live promotion is hard-gated.
# Later this workflow will require a promotion-decision artifact, halt-path
# acknowledgement, and Principal label before any live enablement tag.

name: promote-gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  phase0-hard-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse silent live enablement
        run: |
          set -euo pipefail
          if grep -q 'live_trading_enabled: true' config/risk/environments/live.yaml; then
            echo "::error::live_trading_enabled is true; Phase 0 promote-gate forbids this without Principal Phase 6 acceptance."
            exit 1
          fi
          echo "Promote-gate (Phase 0 skeleton): live trading remains hard-gated."
