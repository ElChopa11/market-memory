# Known instrument identity-start dates for the Polygon ticker-reuse check.
# Not a universe change. Not a monitor.yaml membership edit. Paper only.
#
# Polygon aggregates daily bars by ticker *string*. Resolving NASDAQ:SPCX
# does not prove the series is SpaceX — the same ticker previously belonged
# to The SPAC and New Issue ETF (~$7M AUM).
#
# listed_on is the first session of the *current* legal entity (EDGAR /
# Principal cited). First bar before listed_on → suspected_ticker_reuse →
# exclude from computation/pools. Do not invent run_ids. Do not trim silently.

version: "2026-09-19"
kind: ticker_continuity
owner: intel
promote: false

# N-sigma method (also hardcoded in mm_ingest.equities.continuity):
#   sigma = 1.4826 * MAD(1-bar simple returns)
#   flag if max |1-bar| > n_sigma * sigma
#   if MAD is 0 (flat tape), flag if max |1-bar| > mad_zero_abs_floor
n_sigma: 8.0
sigma_method: robust_mad
mad_zero_abs_floor: 0.05
polygon_free_tier_calendar_days: 730
polygon_free_tier_note: >
  Polygon's 2-year free-tier history limit. On the 2026-09-19 Phase-1 run
  that is 2024-09-19 → 2026-09-18 inclusive (~501 daily bars). This IS the
  vendor cap, not an inferred window.

instruments:
  SPCX:
    qualified_id: NASDAQ:SPCX
    entity: Space Exploration Technologies Corp (SpaceX)
    listed_on: "2026-06-11"
    listed_on_source: >
      EDGAR 424B4 expected_pricing_date / prospectus_date
      (config/listings/watchlist_new_listings.yaml;
      config/watchlist/monitor.yaml lockup_watch.SPCX.prospectus_date)
    prior_entity: "The SPAC and New Issue ETF (~$7M AUM, avg vol ~1.67K)"
    note: >
      Ticker reuse / entity splice. Polygon returns the ETF tape under the
      same string. Principal 2026-09-19: void; exclude from pooled stats.
  CBRS:
    qualified_id: NASDAQ:CBRS
    entity: Cerebras Systems Inc
    listed_on: "2026-05-14"
    listed_on_source: "config/watchlist/monitor.yaml resolution.CBRS.listing_date"
    note: >
      NEW_LISTING. Pre-listing CBRS bars, if Polygon returns them, are a
      different entity and must not enter pools.
