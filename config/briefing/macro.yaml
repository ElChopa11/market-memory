# Cross-asset / macro snapshot. Live HTTP is opt-in and degrades without keys.
# Never put API keys in this file; inject via env (see .env.example).
mode: off
fixture_path: tests/fixtures/briefing/frozen_day.json

# Pulse quality vs the source policy (not fetch success).
# Knowledge clock = brief as_of_knowledge (capture / session as_of). Never published_at alone.
# Every source the live brief turns on must appear here or config load fails.
# There is no gated-source allow-list. See docs/runbooks/market-pulse.md.
#
# FRED lag is per-series calendar age (unchanged):
#   - max_calendar_lag_days at the fred: level is the *daily default*
#   - freshness.fred.series.<SYMBOL> overrides for monthly / low-cadence prints
#     so CPI/NFP at 30–45d are not falsely stale under the daily rule.
# Polygon is session-aware (newer US equity RTH bar due?), not a calendar-day lag.
# grace_minutes 20 = documented 15-minute Starter/Developer recency on
# GET /v2/aggs/ticker/.../range (read 2026-09-24) plus 5 minutes.
# This key was not stopwatched (POLYGON_API_KEY unset). Basic "End-of-day"
# has no minute in that table. Half-days at 13:00 ET are not in the calendar.
freshness:
  fred:
    policy: calendar
    cadence: daily
    # Default for daily FRED (US10Y / DGS10 and any series without an override).
    # Incident 2026-09-22 brief with as-of 2026-09-18 (4d) must not be fresh.
    max_calendar_lag_days: 2
    series:
      # Daily — omit lag to inherit the default above (documented explicitly).
      US10Y:
        cadence: daily
        # inherits max_calendar_lag_days: 2
        fred_series_id: DGS10
      # Monthly / low-cadence — FRED stamps are often month-start; BLS lag is weeks.
      # Age ~30–45d must remain eligible for fresh; only past this threshold → stale.
      CPI:
        cadence: monthly
        max_calendar_lag_days: 45
        fred_series_id: CPIAUCSL
      NFP:
        cadence: monthly
        max_calendar_lag_days: 45
        fred_series_id: PAYEMS
  # US equity RTH daily bars (SPY/QQQ/UUP/USO proxies). Product rule: has a
  # newer session bar become due that we are not showing? Close is hard-coded
  # 16:00 America/New_York. Not covered: Friday after Thanksgiving, weekday
  # Christmas Eve, midweek July 3 (all 13:00 ET), and full weekday holidays.
  polygon:
    policy: session
    cadence: us_rth_daily
    session_timezone: America/New_York
    rth_close: "16:00"
    grace_minutes: 20
  # simple/price has no vendor observation timestamp. The fetcher stamps capture
  # time. A stamp older than this vs the brief clock is stale.
  coingecko:
    policy: snapshot
    cadence: realtime
    max_snapshot_lag_minutes: 20
  # BTC/ETH SoR is a public /info perp mid captured on the brief clock.
  hyperliquid:
    policy: snapshot
    cadence: realtime
    max_snapshot_lag_minutes: 20

# Source of record for BTC/ETH What-moved / cross-asset table slots.
# Table prints HL mid_px (SoR). CoinGecko is ALWAYS fetched on --live as secondary DQ;
# both values + as_of stamps survive in notes. Escalation when |divergence| > path threshold.
crypto_pulse:
  source_of_record: hyperliquid  # mid_px in the table; not CoinGecko spot
  divergence:
    # Preferred: |CG_spot − HL_oracle| / HL_oracle (metric=cg_vs_hl_oracle).
    # 100 bps sits above normal mark−oracle basis (~5–50 bps) but catches splice/wrong ticker.
    max_bps: 100
    # Fallback when oracle missing: |CG − HL_mid| / HL_mid (metric=raw_mid_vs_spot).
    # MUST NOT share 100bps — under stress perp basis can widen well past ~5–6bps and would
    # false-fire source_divergence. 300bps still catches gross wrong-ticker/stale/splice.
    # Escalations tag confidence=low + "basis not subtracted".
    max_bps_raw_mid_vs_spot: 300
    # symbols:
    #   BTC: { max_bps: 100, max_bps_raw_mid_vs_spot: 300 }

live:
  enabled: false
  # Shared retry policy for live macro HTTP (CoinGecko / Polygon / FRED / Stooq canary).
  # Exponential backoff + jitter via mm_common.http; honour Retry-After; ceiling several seconds.
  http:
    max_attempts: 5
    backoff_s: 0.25
    backoff_ceiling_s: 8.0
  # Stooq is not the Pulse primary path (SRC-STOOQ-404 http_404). Optional canary only;
  # no scrape fallback. Prefer polygon ETF proxies below.
  stooq:
    enabled: false
    base_url: https://stooq.com/q/l/
    symbols: {}
  # Stocks-plan US ETFs via Polygon (POLYGON_API_KEY). True CME ES/NQ/CL futures
  # need a futures subscription we do not have — these are proxies, not futures.
  polygon:
    enabled: false
    api_key_env: POLYGON_API_KEY
    base_url: https://api.polygon.io
    lookback_calendar_days: 10
    max_attempts: 5
    backoff_s: 0.25
    backoff_ceiling_s: 8.0
    symbols:
      ES:
        ticker: SPY
        label: "SPY ETF (proxy for S&P 500; not ES futures)"
      NQ:
        ticker: QQQ
        label: "QQQ ETF (proxy for Nasdaq-100; not NQ futures)"
      DXY:
        ticker: UUP
        label: "UUP ETF (USD proxy; not DX futures / DXY)"
      CL:
        ticker: USO
        label: "USO ETF (WTI oil proxy; not CL futures)"
    # True VIX / VX needs Cboe entitlement; not on Polygon stocks plan.
    structural_unavailable:
      VIX:
        reason: >-
          true VIX/VX needs Cboe entitlement not on Polygon stocks plan;
          no CME/CFE licence; VIXY ETF is not VIX (SRC-STOOQ-404)
  fred:
    enabled: false
    # https://fred.stlouisfed.org — key from FRED_API_KEY
    api_key_env: FRED_API_KEY
    base_url: https://api.stlouisfed.org/fred/series/observations
    max_attempts: 5
    backoff_s: 0.25
    backoff_ceiling_s: 8.0
    series:
      US10Y: DGS10
  coingecko:
    # Always enabled by live_macro_spec when ids are present (--live always fetches).
    enabled: false
    base_url: https://api.coingecko.com/api/v3/simple/price
    max_attempts: 5
    backoff_s: 0.25
    backoff_ceiling_s: 8.0
    ids:
      BTC: bitcoin
      ETH: ethereum
