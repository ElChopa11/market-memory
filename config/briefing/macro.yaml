# Cross-asset / macro snapshot. Live HTTP is opt-in and degrades without keys.
# Never put API keys in this file; inject via env (see .env.example).
mode: off
fixture_path: tests/fixtures/briefing/frozen_day.json

# Pulse quality vs observation age (not fetch success).
# Age = calendar days between observation date (FRED `date` / AssetPrint.as_of)
# and brief as_of_knowledge (capture / session as_of). Never published_at alone.
# Beyond max_calendar_lag_days → stale (never fresh). See docs/runbooks/market-pulse.md.
freshness:
  fred:
    cadence: daily
    # Principal-reasonable for FRED daily series (US10Y / DGS10): stale when age > 2.
    # Incident 2026-09-22 brief with as-of 2026-09-18 (4d) must not be fresh.
    max_calendar_lag_days: 2

live:
  enabled: false
  stooq:
    enabled: false
    # Public CSV quotes (no key). https://stooq.com
    base_url: https://stooq.com/q/l/
    symbols:
      ES: es.f
      NQ: nq.f
      DXY: dx.f
      CL: cl.f
      VIX: ^vix
  fred:
    enabled: false
    # https://fred.stlouisfed.org — key from FRED_API_KEY
    api_key_env: FRED_API_KEY
    base_url: https://api.stlouisfed.org/fred/series/observations
    series:
      US10Y: DGS10
  coingecko:
    enabled: false
    # Public market snapshot; no key required for this endpoint.
    base_url: https://api.coingecko.com/api/v3/simple/price
    ids:
      BTC: bitcoin
      ETH: ethereum
