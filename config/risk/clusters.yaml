# Concentration clusters from versioned trailing-corr config (Phase 6c / IMP-016).
# Risk nets same cluster. Membership is corr vs seed, not a hand-named live list in code.

version: "imp-016.1"
window: 60
min_overlap: 20
corr_threshold: 0.65
max_cluster_pct: 50
rule_id: cluster_concentration

clusters:
  crypto-beta:
    seed: BTC
    candidates: [BTC, ETH, UNI, AAVE]
  semis:
    seed: NVDA
    candidates: [NVDA, AVGO, SMH]
  mega-cap-tech:
    seed: MSFT
    candidates: [MSFT, META, NVDA, AVGO]
  rates-sensitive:
    seed: JPM
    candidates: [JPM, XLF]
