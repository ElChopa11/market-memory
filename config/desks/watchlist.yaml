# Watchlist monitor (IMP-020 scan + IMP-033 Principal review list).
# Review list: config/watchlist/monitor.yaml (Intel-owned resolution).
# Membership still from config/universe.yaml. No promotion. No LLM. No send.
# Telegram fan-out is Ops-owned IMP-021.

version: "imp-033.1"
desk: research
product: watchlist
cadence: daily
op: observation
owner_config: intel
monitor: config/watchlist/monitor.yaml
universe: config/universe.yaml
include:
  - in_universe
  - watch_only
  - monitor_review_list
exclude:
  - deferred_must_cut_as_membership
promote: false
llm: false
send: false
states:
  - COVERED
  - PARTIAL
  - UNAVAILABLE
  - UNRESOLVED
  - BLOCKED
playbook:
  # Flag existing PLAYBOOK EDGE_SCAN setups. Do not compute trade math here.
  inherit_setup_flag: true
  inherit_trade_math: false
footer: >
  Not a call. Not a Quant verdict. Locked membership is not promotion.
  Review list is config/watchlist/monitor.yaml. deferred_must_cut names on
  that list are monitor-by-archive only. Missing tape stays unavailable.
