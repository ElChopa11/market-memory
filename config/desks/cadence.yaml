# Desk mesh cadence (Phase 6c-1 / IMP-018). Five publishing desks.
# Principal lock: bus = Postgres LISTEN/NOTIFY (no Redis).
# Coord/Don is orchestration only — not a publishing desk.
# Regime header is filled from Intel's macro sleeve when that run succeeds.

version: "imp-018.1"
regime_placeholder: unset
default:
  cadence: daily
  op: observation

# NOTIFY channels. Payloads are lightweight ids/keys; envelopes live in Market Memory.
# coord.assemble remains the orchestration channel (not a desk slug).
channels:
  - desk.intel.output
  - desk.intel.alert
  - desk.research.output
  - desk.research.alert
  - desk.quant.output
  - desk.quant.alert
  - desk.ic_risk.output
  - desk.ic_risk.alert
  - desk.ops.output
  - desk.ops.alert
  - coord.assemble
  - dq.event

desks:
  intel:
    cadence: daily
    op: observation
    output_channel: desk.intel.output
    alert_channel: desk.intel.alert
    dq_channel: dq.event
  research:
    cadence: daily
    op: observation
    output_channel: desk.research.output
    alert_channel: desk.research.alert
  quant:
    cadence: daily
    op: observation
    output_channel: desk.quant.output
    alert_channel: desk.quant.alert
  ic_risk:
    cadence: daily
    op: paper
    output_channel: desk.ic_risk.output
    alert_channel: desk.ic_risk.alert
  ops:
    cadence: daily
    op: observation
    output_channel: desk.ops.output
    alert_channel: desk.ops.alert
