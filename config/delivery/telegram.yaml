# Telegram Bot API delivery (Phase 5e / IMP-013 + 6c-1 five-desk roster + 6c-5 Ops expansion).
# Secrets are env-only. Never put TELEGRAM_BOT_TOKEN or chat ids in this file.
# Per-desk override: TELEGRAM_CHAT_ID_<DESK> (e.g. TELEGRAM_CHAT_ID_INTEL).
# Default chat: TELEGRAM_CHAT_ID. Token: TELEGRAM_BOT_TOKEN.
# Delivery is Ops-owned. Coord/Don is orchestration only — not the publisher.
# Channel matrix must match mm_common.naming ROUTE_SLUGS (five desks + alerts).

owner: ops
publisher: ops
coordinator: orchestration_only

channel: telegram
parse_mode: MarkdownV2
max_message_chars: 4096
disable_web_page_preview: true

api:
  base_url: https://api.telegram.org
  timeout_seconds: 8
  max_attempts: 2
  backoff_s: 0.25

rate_limit:
  max_requests_per_minute: 20

quiet_hours:
  enabled: true
  timezone: Australia/Sydney
  start: "22:00"
  end: "07:00"

dedupe:
  ttl_seconds: 86400

# Never alert without a numeric threshold.
thresholds:
  require_threshold_config: true
  desk_pack:
    enabled: true
    min_completeness_pct: 1
  alert:
    enabled: true
    min_events: 1
  test:
    enabled: true
    min_completeness_pct: 0
  watchlist:
    enabled: true
    min_completeness_pct: 1
  listings:
    enabled: true
    min_completeness_pct: 1

schedule:
  timezone: Australia/Sydney
  desk_pack:
    enabled: true
    local_time: "07:30"
    weekdays: [Mon, Tue, Wed, Thu, Fri]
  # Watchlist Ops cut. Not the Sydney 08:00 digest (SCHED-001 stays OPEN).
  watchlist:
    enabled: true
    local_time: "07:45"
    weekdays: [Mon, Tue, Wed, Thu, Fri]
  # Listings Ops cut. Not the Sydney 08:00 digest (SCHED-001 stays OPEN).
  listings:
    enabled: true
    local_time: "07:50"
    weekdays: [Mon, Tue, Wed, Thu, Fri]

desks:
  ops:
    enabled: true
    chat_id_env: TELEGRAM_CHAT_ID
    thread_id: null
  intel:
    enabled: true
    chat_id_env: TELEGRAM_CHAT_ID_INTEL
    thread_id: null
  research:
    enabled: true
    chat_id_env: TELEGRAM_CHAT_ID_RESEARCH
    thread_id: null
  quant:
    enabled: true
    chat_id_env: TELEGRAM_CHAT_ID_QUANT
    thread_id: null
  ic_risk:
    enabled: true
    chat_id_env: TELEGRAM_CHAT_ID_IC_RISK
    thread_id: null
  alerts:
    enabled: true
    chat_id_env: TELEGRAM_CHAT_ID_ALERTS
    thread_id: null

# Existing desk artifacts Ops may fan-out. Does not invent content.
products:
  watchlist:
    desk: research
    kind: watchlist
    sleeve: watchlist
    enabled: true
    inherit_content_hash: true
  listings:
    desk: research
    kind: listings
    sleeve: listings
    enabled: true
    inherit_content_hash: true

inbound:
  enabled: false
  allowlist:
    - /status
    - /brief
    - /desk
    - /idea
    - /gaps
    - /halt
