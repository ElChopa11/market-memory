params:
  N: 20         # breakout lookback (N-bar extreme)
  X: 0.5        # min first-pullback depth in ATR
  Y: 0.4        # min second-pullback depth in ATR
  Z: 0.1        # trigger: close back through the second-pullback extreme by Z·ATR
  M: 0.3        # invalidation beyond the second-pullback extreme in ATR
  atr_period: 14
  time_stop_bars: 15
  max_concurrent: 1

look_ahead:
  pit_clock: available_at
  observation_clock: as_of_knowledge
  risks:
    - "labeling a pullback as 'first' only because a second one later appears (uses the future)"
    - "breakout using an N-bar high that includes the decision bar"
    - "trigger on an intra-bar extreme before available_at"
    - "using market_time / published_at instead of available_at"
  notes: "The second-entry signal may fire only after the second pullback is complete and the trigger close is available. The first pullback is identified from bars ≤ its own available_at, without requiring that a second pullback exist. If no second pullback forms, there is no trigger (not a 'failed first' label from the future)."

